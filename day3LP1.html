<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card with Internal CSS</title>
    
    <style>
        body {
            font-family: sans-serif;
            background-color: white;
            padding: 20px;
        }

        .product-card {
            width: 220px;
            padding: 10px;
            box-sizing: border-box;
        }

        .image-container {
            position: relative; 
            width: 100%;
            height: 160px;
            border: 1px solid lightgray;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .image-container img {
            max-width: 80%;
            max-height: 80%;
        }

        .add-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: white;
            color: red;
            border: 2px solid red;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .price-section {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .current-price {
            background-color: green;
            color: white;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 24px;
            border-radius: 6px;
        }

        .original-price {
            color: gray;
            text-decoration: line-through;
            font-size: 21px;
        }

        .discount-text {
            color: green;
            font-weight: bold;
            font-size: 17px;
            margin: 5px 0;
        }

        .product-title {
            font-size: 25px;
            margin: 8px 0 2px 0;
            color: black;
        }

        .product-quantity {
            color: gray;
            margin: 0 0 8px 0;
            font-size: 15px;
        }

        .rating-badge {
            background-color: limegreen;
            color: white;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .rating-badge .star {
            font-size: 13px;
        }

        .rating-count {
            color: white;
            font-weight: normal;
            margin-left: 2px;
        }
    </style>
</head>
