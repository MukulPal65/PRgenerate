<!DOCTYPE html>
<html>
<head>
    <title>Navbar</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            padding:20px;
            font-family:Times New Roman, serif;
        }

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            border:2px solid rgb(75, 34, 6);
            border-radius:25px;
            padding:15px 25px;
        }

        .logo{
            font-size:20px;
            font-weight:bold;
            color:navy;
        }

        .nav-links{
            list-style:none;
            display:flex;
            gap:50px;
        }
        
        .nav-links li a{
            text-decoration:none;
            color:darkblue;
            font-size:30px;
        }


        .buttons{
            display:flex;
            gap:20 px;
        }

       
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <img src="https://avatars.githubusercontent.com/u/156795978?v=4" alt="logo" width="100px">
        </div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Placements</a></li>
        </ul>

        <div class="buttons">
            <button>Login</button>
            <button>Sign Up</button>
        </div>

    </nav>

</body>
</html>
